<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Shutdown Control</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img src="/img/logo.png" alt="IT Solutions">
        <div><strong>SHUTDOWN</strong><small>CONTROL CENTER</small></div>
      </div>
      <div class="eyebrow">OPERACIÓN · BHP SPENCE</div>
      <h1 id="login-title">Bienvenido</h1>
      <p>Ingresa tus credenciales para acceder al centro de control operacional.</p>
      <p class="login-error{{ERROR_CLASS}}" role="alert">{{ERROR}}</p>
      <form method="post" action="/login" class="login-form">
        <label for="username">Correo electrónico o cuenta inicial</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus maxlength="254">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
        <button type="submit">Iniciar sesión</button>
      </form>
      <small class="login-help">Acceso restringido a personal autorizado.</small>
    </section>
  </main>
</body>
</html>
